name: Test protocol

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Configuration check without secret
        run: python -m temporal_mailbox doctor --allow-missing-key
      - name: Offline end-to-end simulation
        run: python -m temporal_mailbox simulate
